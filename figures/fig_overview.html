<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fig_overview</title>
<style>
/* Prose, labels and headings are set in IBM Plex Sans, which journals ask for in
   figure lettering and which keeps the diagram from reading as a slab of body
   text.  Mathematical notation and every printed quantity stay in Linux
   Libertine, the face acmart loads through the libertine package, so that a
   symbol or a number in the figure has the same shape as the same symbol or
   number in the running text.  The Libertine TrueType copies are produced by
   figures/render_html.py, because Chromium embeds CFF-flavoured OpenType as
   Type 3. */
@font-face { font-family:"Plex"; font-weight:400; src:url("fonts/IBMPlexSans-Regular.ttf"); }
@font-face { font-family:"Plex"; font-weight:500; src:url("fonts/IBMPlexSans-Medium.ttf"); }
@font-face { font-family:"Plex"; font-weight:600; src:url("fonts/IBMPlexSans-SemiBold.ttf"); }
@font-face { font-family:"Plex"; font-weight:700; src:url("fonts/IBMPlexSans-Bold.ttf"); }
@font-face { font-family:"Libertine"; font-weight:400; font-style:normal;
  src:url("../build/fonts/LinLibertine_R.ttf"); }
@font-face { font-family:"Libertine"; font-weight:400; font-style:italic;
  src:url("../build/fonts/LinLibertine_RI.ttf"); }
@font-face { font-family:"Libertine"; font-weight:700; font-style:normal;
  src:url("../build/fonts/LinLibertine_RB.ttf"); }

/* One chromatic hue, and a neutral that leans to the same warm side of the
   wheel as it does, so that the darkest ink reads as a companion to the red
   rather than as printer's black beside it.  Ink carries the forward path and
   the ordered network, clay carries the reversal and the part of the rate that
   needs block order, and slate carries the order-invariant part.  The three
   separate by lightness as well as by hue, so the figure survives a monochrome
   printout. */
:root{
  --ink:#3A3531;
  --clay:#B23B2C;
  --slate:#8B837A;
  --mute:#5C554D;
  --rule:#D2CDC6;
  --tint:#F4F2EF;
  /* The pooled quantity is SLATE in Figures 2, 4 and 5, and this lane is
     the key the reader meets first, so it uses the same grey. */
  --fill:#8B837A;
}

@page { size: 504pt 178pt; margin: 0; }
html,body{ margin:0; padding:0; }
body{
  width:504pt; height:178pt;
  font-family:"Plex",sans-serif; font-size:9pt; line-height:1.32;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

.sheet{ display:grid; grid-template-columns:1fr 1fr 1fr;
  height:178pt; box-sizing:border-box; padding:0 4pt; }
.lane{ padding:0 10pt; box-sizing:border-box; }
.lane + .lane{ border-left:0.6pt solid var(--rule); }

.lane-head{ display:flex; align-items:baseline; gap:5pt;
  border-bottom:0.9pt solid var(--ink); padding-bottom:2.4pt; margin-bottom:7pt; }
.lane-num{ font-weight:700; font-size:9pt; color:var(--clay); }
.lane-title{ font-weight:600; font-size:9pt;
  letter-spacing:.045em; text-transform:uppercase; }

.legend{ font-size:8.2pt; color:var(--mute);
  display:flex; gap:12pt; margin-bottom:4pt; }
.legend span{ display:flex; align-items:center; gap:4pt; }
.swatch{ display:inline-block; width:15pt; height:0; }
.sw-f{ border-top:1.4pt solid var(--ink); }
.sw-r{ border-top:1.4pt dashed var(--clay); }

.vig{ margin-bottom:6pt; }
.vig-title{ font-weight:600; font-size:8.4pt; margin-bottom:2pt; }
.vig-note{ font-size:8.2pt; color:var(--mute); line-height:1.24; margin-top:2pt; }
svg{ display:block; width:100%; overflow:visible; }

.sub{ font-size:0.7em; vertical-align:-0.24em; }

/* Lane 3 legend.  The two keys stack, because "requires block order" does not
   fit beside "order-invariant" at this size and shortening either one would
   lose the distinction the whole lane rests on. */
.keys{ font-size:8.2pt; color:var(--mute); margin-bottom:4pt; }
.keys div{ display:flex; align-items:center; gap:5pt; margin-top:1.5pt; }
.chip{ display:inline-block; width:9pt; height:5.4pt; }
.chip-p{ background:var(--fill); }
.chip-o{ background:var(--clay); }

</style>
</head>
<body>
<div class="sheet">

<!-- ── lane 1 ─────────────────────────────────────────────────────────── -->
<div class="lane">
  <div class="lane-head"><span class="lane-num">1</span>
    <span class="lane-title">An arrow of time</span></div>

  <div class="legend">
    <span><i class="swatch sw-f"></i>forward</span>
    <span><i class="swatch sw-r"></i>reversed</span>
  </div>

  <div class="vig">
    <div class="vig-title">volatility</div>
    <!-- The reversed trace is the exact mirror of the forward one about the
         midpoint of the x range, shifted down, so the two curves carry the same
         values in opposite order and nothing else. -->
    <svg viewBox="0 0 145 34" role="img">
      <text x="0" y="21" font-family="Libertine" font-size="11" fill="#5C554D">&#8800;</text>
      <polyline fill="none" stroke="#3A3531" stroke-width="1.4" stroke-linejoin="round"
        points="15,14 28,13.84 38,14 45,13.92 48,14 49,2 57,4.16 65,5.84 75,7.44 87,9.12 100,10.72 114,12.08 129,13.2 143,13.84"/>
      <polyline fill="none" stroke="#B23B2C" stroke-width="1.4" stroke-linejoin="round"
        stroke-dasharray="3.2 2"
        points="15,31.84 29,31.2 44,30.08 58,28.72 71,27.12 83,25.44 93,23.84 101,22.16 109,20 110,32 113,31.92 120,32 130,31.84 143,32"/>
    </svg>
    <div class="vig-note">it rises abruptly and calms slowly, never the reverse</div>
  </div>

  <div class="vig">
    <div class="vig-title">book states</div>
    <svg viewBox="0 0 145 30" role="img">
      <text x="0" y="18" font-family="Libertine" font-size="11" fill="#5C554D">&#8800;</text>
      <g font-family="Libertine" font-size="9.5" font-style="italic" fill="#3A3531">
        <rect x="15" y="0" width="18" height="12" fill="none" stroke="#3A3531" stroke-width="1"/>
        <text x="24" y="9" text-anchor="middle">A</text>
        <line x1="33" y1="6" x2="40" y2="6" stroke="#3A3531" stroke-width="1.1"/>
        <path d="M41,6 l-4,-2.3 v4.6 z" fill="#3A3531"/>
        <rect x="43" y="0" width="18" height="12" fill="none" stroke="#3A3531" stroke-width="1"/>
        <text x="52" y="9" text-anchor="middle">B</text>
        <line x1="61" y1="6" x2="68" y2="6" stroke="#3A3531" stroke-width="1.1"/>
        <path d="M69,6 l-4,-2.3 v4.6 z" fill="#3A3531"/>
        <rect x="71" y="0" width="18" height="12" fill="none" stroke="#3A3531" stroke-width="1"/>
        <text x="80" y="9" text-anchor="middle">C</text>
        <line x1="89" y1="6" x2="96" y2="6" stroke="#3A3531" stroke-width="1.1"/>
        <path d="M97,6 l-4,-2.3 v4.6 z" fill="#3A3531"/>
        <rect x="99" y="0" width="18" height="12" fill="none" stroke="#3A3531" stroke-width="1"/>
        <text x="108" y="9" text-anchor="middle">D</text>
        <text x="121" y="9" font-style="normal" fill="#5C554D">&#8943;</text>

        <text x="15" y="27" font-style="normal" fill="#5C554D">&#8943;</text>
        <rect x="27" y="18" width="18" height="12" fill="none" stroke="#B23B2C"
          stroke-width="1" stroke-dasharray="3.2 2"/>
        <text x="36" y="27" text-anchor="middle" fill="#5C554D">D</text>
        <line x1="45" y1="24" x2="52" y2="24" stroke="#B23B2C" stroke-width="1.1"
          stroke-dasharray="3.2 2"/>
        <path d="M53,24 l-4,-2.3 v4.6 z" fill="#B23B2C"/>
        <rect x="55" y="18" width="18" height="12" fill="none" stroke="#B23B2C"
          stroke-width="1" stroke-dasharray="3.2 2"/>
        <text x="64" y="27" text-anchor="middle" fill="#5C554D">C</text>
        <line x1="73" y1="24" x2="80" y2="24" stroke="#B23B2C" stroke-width="1.1"
          stroke-dasharray="3.2 2"/>
        <path d="M81,24 l-4,-2.3 v4.6 z" fill="#B23B2C"/>
        <rect x="83" y="18" width="18" height="12" fill="none" stroke="#B23B2C"
          stroke-width="1" stroke-dasharray="3.2 2"/>
        <text x="92" y="27" text-anchor="middle" fill="#5C554D">B</text>
        <line x1="101" y1="24" x2="108" y2="24" stroke="#B23B2C" stroke-width="1.1"
          stroke-dasharray="3.2 2"/>
        <path d="M109,24 l-4,-2.3 v4.6 z" fill="#B23B2C"/>
        <rect x="111" y="18" width="18" height="12" fill="none" stroke="#B23B2C"
          stroke-width="1" stroke-dasharray="3.2 2"/>
        <text x="120" y="27" text-anchor="middle" fill="#5C554D">A</text>
      </g>
    </svg>
    <div class="vig-note">the order carries the asymmetry</div>
  </div>
</div>

<!-- ── lane 2 ─────────────────────────────────────────────────────────── -->
<div class="lane">
  <div class="lane-head"><span class="lane-num">2</span>
    <span class="lane-title">How we measure it</span></div>

  <!-- s0 is what both columns compute, so it sits inside the box as their
       shared definition.  Each column then emits its own rate, and the
       ordering increment is the brace between the two, which is the same
       reading as the dashed connectors in Figures 3(c) and 5(a). -->
  <svg viewBox="0 0 145 153" role="img">
    <g font-family="Libertine" font-size="12" fill="#3A3531">
      <text x="25" y="10" text-anchor="middle" font-style="italic">W</text>
      <text x="120" y="10" text-anchor="middle" font-style="italic">RW</text>
    </g>
    <g font-family="Plex" font-size="8" fill="#5C554D">
      <text x="25" y="20" text-anchor="middle">observed</text>
      <text x="120" y="20" text-anchor="middle">reversed</text>
    </g>

    <line x1="42" y1="6" x2="103" y2="6" stroke="#B23B2C" stroke-width="1.1"/>
    <path d="M104,6 l-4,-2.3 v4.6 z" fill="#B23B2C"/>
    <path d="M41,6 l4,-2.3 v4.6 z" fill="#B23B2C"/>
    <text x="72.5" y="3" text-anchor="middle" font-family="Libertine" font-size="11"
      font-style="italic" fill="#B23B2C">R</text>

    <line x1="25" y1="25" x2="25" y2="32" stroke="#3A3531" stroke-width="1"/>
    <path d="M25,33 l-2.3,-4 h4.6 z" fill="#3A3531"/>
    <line x1="120" y1="25" x2="120" y2="32" stroke="#3A3531" stroke-width="1"/>
    <path d="M120,33 l-2.3,-4 h4.6 z" fill="#3A3531"/>

    <rect x="2" y="37" width="141" height="78" fill="#F4F2EF" stroke="#3A3531"
      stroke-width="1"/>
    <text x="8" y="50" fill="#3A3531"><tspan font-family="Plex" font-size="8.8"
      font-weight="600">estimator</tspan><tspan font-family="Libertine"
      font-size="11" font-style="italic" dx="4">g</tspan></text>
    <line x1="2" y1="55" x2="143" y2="55" stroke="#D2CDC6" stroke-width="0.7"/>
    <line x1="72" y1="55" x2="72" y2="91" stroke="#D2CDC6" stroke-width="0.7"/>
    <g font-family="Plex" font-size="8.4">
      <text x="8" y="66" font-weight="600" fill="#8B837A">pooled</text>
      <text x="8" y="76" font-size="7.6" fill="#5C554D">permutation</text>
      <text x="8" y="84" font-size="7.6" fill="#5C554D">invariant</text>
      <text x="79" y="66" font-weight="600" fill="#3A3531">ordered</text>
      <text x="79" y="76" font-size="7.6" fill="#5C554D">dilated temporal</text>
      <text x="79" y="84" font-size="7.6" fill="#5C554D">convolutions</text>
    </g>
    <line x1="2" y1="91" x2="143" y2="91" stroke="#D2CDC6" stroke-width="0.7"/>
    <text x="72.5" y="103" text-anchor="middle" font-family="Libertine" font-size="11"
      fill="#3A3531"><tspan font-style="italic">s</tspan><tspan font-size="7.7"
      dy="2">0</tspan><tspan dy="-2">&#8195;&#8594;&#8195;log&#8201;</tspan><tspan
      font-style="italic">p</tspan>(<tspan font-style="italic">W</tspan>)&#8201;/&#8201;<tspan
      font-style="italic">p</tspan>(<tspan font-style="italic">RW</tspan>)</text>
    <text x="72.5" y="112" text-anchor="middle" font-family="Plex" font-size="7.4"
      fill="#5C554D">per event, in nats</text>

    <line x1="37" y1="116" x2="37" y2="123" stroke="#3A3531" stroke-width="1"/>
    <path d="M37,124 l-2.3,-4 h4.6 z" fill="#3A3531"/>
    <line x1="108" y1="116" x2="108" y2="123" stroke="#3A3531" stroke-width="1"/>
    <path d="M108,124 l-2.3,-4 h4.6 z" fill="#3A3531"/>

    <g font-family="Libertine" font-size="10.5" fill="#3A3531">
      <text x="37" y="134" text-anchor="middle"><tspan font-style="italic">&#206;</tspan><tspan
        font-size="7.4" dy="2">pooled</tspan></text>
      <text x="108" y="134" text-anchor="middle"><tspan font-style="italic">&#206;</tspan><tspan
        font-size="7.4" dy="2">ordered</tspan></text>
    </g>

    <path d="M37,138 v4 h71 v-4" fill="none" stroke="#B23B2C" stroke-width="0.9"
      stroke-dasharray="2 1.4"/>
    <text x="72.5" y="151" text-anchor="middle" font-family="Libertine" font-size="11"
      fill="#B23B2C">&#916;<tspan font-size="7.7" dy="2">order</tspan></text>
  </svg>
</div>

<!-- ── lane 3 ─────────────────────────────────────────────────────────── -->
<div class="lane">
  <div class="lane-head"><span class="lane-num">3</span>
    <span class="lane-title">What &#916;<span class="sub">order</span> shows</span></div>

  <div class="keys">
    <div><i class="chip chip-p"></i>without block order</div>
    <div><i class="chip chip-o"></i>requires block order</div>
  </div>

  <!-- The three bars decompose almost the same total rate.  The first two are
       two decompositions of the identical 0.0537, one by architecture and one
       by the transition surrogate, and the third is a simulator that happens to
       reach the same total.  Because the totals agree, the length of the clay
       segment reads directly as its share, which is what the percentage on the
       label line states.  The bar runs the full lane width, so the labels sit
       above rather than beside it.  Bars are scaled at 128 units to 0.0537 nats
       per event. -->
  <svg viewBox="0 0 145 128" role="img">
    <g font-family="Plex" font-size="8.4" fill="#3A3531">
      <text x="0" y="8">real book</text>
      <text x="0" y="52">real book, one-step surrogate</text>
      <text x="0" y="96">queue-reactive simulator</text>
    </g>
    <g font-family="Libertine" font-size="10" fill="#3A3531">
      <text x="145" y="8" text-anchor="end">33%</text>
      <text x="145" y="52" text-anchor="end">30%</text>
      <text x="145" y="96" text-anchor="end">1.3%</text>
    </g>

    <g>
      <rect x="0" y="12" width="85.6" height="13" fill="#8B837A"/>
      <rect x="85.6" y="12" width="42.7" height="13" fill="#B23B2C"/>
      <rect x="0" y="56" width="89.6" height="13" fill="#8B837A"/>
      <rect x="89.6" y="56" width="38.4" height="13" fill="#B23B2C"/>
      <rect x="0" y="100" width="121.6" height="13" fill="#8B837A"/>
      <rect x="121.6" y="100" width="1.55" height="13" fill="#B23B2C"/>
    </g>

    <g font-family="Libertine" font-size="8.6" fill="#5C554D">
      <text x="0" y="35">0.0359 + 0.0179</text>
      <text x="0" y="79">0.0376 + 0.0161</text>
      <text x="0" y="123">0.0510 + 0.00065</text>
    </g>
  </svg>
</div>

</div>
</body>
</html>
